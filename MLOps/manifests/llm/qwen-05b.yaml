apiVersion: v1
kind: Namespace
metadata:
  name: lab2-llm
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen-05b
  namespace: lab2-llm
  annotations:
    serving.kserve.io/deploymentMode: Knative
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containerConcurrency: 1
    containers:
      - name: kserve-container
        image: ghcr.io/ggml-org/llama.cpp@sha256:9222db8bf58b508a36df219e16c9c9d6e2e15c6e0b80df03896bba09a14b8ccf
        args:
          - --model-url
          - https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/9217f5db79a29953eb74d5343926648285ec7e67/qwen2.5-0.5b-instruct-q4_k_m.gguf
          - --alias
          - qwen-05b
          - --host
          - 0.0.0.0
          - --port
          - "8080"
          - --api-prefix
          - /openai
          - --no-webui
          - --threads
          - "4"
          - --threads-batch
          - "4"
          - --ctx-size
          - "1024"
          - --parallel
          - "1"
          - --n-gpu-layers
          - "0"
        env:
          - name: LLAMA_CACHE
            value: /tmp/llama-cache
        ports:
          - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /openai/health
            port: 8080
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: "4"
            memory: 1Gi
          limits:
            cpu: "4"
            memory: 2Gi
